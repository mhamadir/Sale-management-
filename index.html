<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sales Tracker</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <!-- Use Vite's processed Tailwind file -->
  <link rel="stylesheet" href="/src/index.css" />
  <!-- Self-contained SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen relative pb-24 transition-colors duration-200 border-t-4 border-indigo-600">
  <div class="max-w-6xl mx-auto p-4 md:p-6">
    <!-- Header Section -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">📊</div>
        <div>
          <h1 class="text-lg font-bold leading-tight" data-i18n="appTitle">Sales Tracker</h1>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-md border border-slate-200 flex-1 md:flex-none">
          <label for="input-exchange-rate" class="text-xs font-semibold text-slate-500 whitespace-nowrap" data-i18n="exchangeRateLabel">100$ =</label>
          <input type="number" id="input-exchange-rate" class="w-20 bg-transparent text-sm font-bold text-slate-900 outline-none text-right" dir="ltr" value="150000">
          <span class="text-xs font-semibold text-slate-500">IQD</span>
        </div>
        <button type="button" id="currencyToggle" class="px-3 py-1.5 border border-slate-200 bg-slate-50 rounded-md text-xs font-bold text-slate-700 hover:bg-slate-100 transition-colors">
          USD ($)
        </button>
        <button type="button" id="langToggle" class="px-3 py-1.5 border border-slate-200 rounded-md text-xs font-semibold hover:bg-slate-50" data-i18n="langToggle">کوردی</button>
      </div>
    </header>

    <main>
      <!-- Dashboard Metrics -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="totalItems">Total Items Sold</div>
          <div class="text-2xl font-bold text-slate-900" id="stat-items">0</div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="totalCost">Total Cost Price</div>
          <div class="text-2xl font-bold text-slate-900" id="stat-cost">$0.00</div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="totalSold">Total Sold Price</div>
          <div class="text-2xl font-bold text-slate-900" id="stat-sold">$0.00</div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-indigo-200 shadow-md bg-indigo-50/30">
          <div class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-1" data-i18n="totalProfit">Total Profit</div>
          <div class="text-2xl font-bold text-indigo-700" id="stat-profit">$0.00</div>
        </div>
      </div>

      <!-- History List -->
      <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
        <div class="px-4 py-3 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50/50 gap-4">
          <h3 class="text-sm font-bold text-slate-700 uppercase tracking-tight whitespace-nowrap" data-i18n="historyTitle">Order History</h3>
          
          <div class="flex flex-col sm:flex-row w-full sm:w-auto gap-3">
            <div class="flex bg-slate-200/50 p-1 rounded-lg">
              <button type="button" class="tab-btn flex-1 sm:flex-none px-3 py-1.5 rounded-md text-xs font-bold bg-white text-indigo-600 shadow-sm transition-all" data-tab="all" data-i18n="tabAll">All</button>
              <button type="button" class="tab-btn flex-1 sm:flex-none px-3 py-1.5 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-700 transition-all" data-tab="profit" data-i18n="tabProfit">Profitable</button>
              <button type="button" class="tab-btn flex-1 sm:flex-none px-3 py-1.5 rounded-md text-xs font-semibold text-slate-500 hover:text-slate-700 transition-all" data-tab="loss" data-i18n="tabLoss">Loss / Zero</button>
            </div>
            
            <div class="relative w-full sm:w-56">
              <input type="text" id="input-search" class="w-full ps-9 pe-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all placeholder-slate-400 text-slate-800 font-medium" placeholder="Search..." data-i18n-placeholder="searchPlaceholder">
              <svg class="absolute start-2.5 top-2 w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
          </div>
        </div>
        <div id="history-list" class="divide-y divide-slate-100">
           <!-- Dynamic list items will be injected here -->
        </div>
        
        <!-- Empty State -->
        <div id="no-records" class="hidden p-10 text-center">
          <span class="text-3xl block mb-4 opacity-30">📂</span>
          <div class="text-slate-500 font-medium text-sm" data-i18n="noRecords">No records found.</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Floating Action Button (FAB) -->
  <button type="button" id="fab-add" class="fixed bottom-8 end-8 w-14 h-14 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-105 hover:-translate-y-1 z-10" aria-label="Add new record">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>
  
  <!-- Add New Record Modal -->
  <div id="modal-add" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl border border-slate-200 shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
      <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50">
        <h2 class="text-lg font-bold text-slate-800" data-i18n="addTitle">Add New Record</h2>
      </div>
      <div class="p-5 overflow-y-auto">
        <form id="form-add" class="space-y-4">
           <div>
             <label for="input-itemName" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="itemName">Item Name</label>
             <input type="text" id="input-itemName" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm text-slate-900">
           </div>
           <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
             <div>
               <label for="input-buyerName" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="buyerName">Buyer Name</label>
               <input type="text" id="input-buyerName" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm text-slate-900">
             </div>
             <div>
               <label for="input-buyerPhone" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="buyerPhone">Buyer Phone Number</label>
               <input type="tel" id="input-buyerPhone" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm text-slate-900" dir="ltr">
             </div>
           </div>
           <div>
             <label for="input-serial" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="serialNumber">Item Serial Number</label>
             <input type="text" id="input-serial" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none font-mono text-sm text-slate-900" dir="ltr">
           </div>
           <div class="grid grid-cols-2 gap-4">
             <div>
               <label for="input-cost" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="costPrice">Cost Price ($)</label>
               <input type="number" step="0.01" min="0" id="input-cost" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none font-mono text-sm font-bold text-slate-900" dir="ltr">
             </div>
             <div>
               <label for="input-price" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1" data-i18n="sellingPrice">Selling Price ($)</label>
               <input type="number" step="0.01" min="0" id="input-price" required class="w-full px-3 py-2 bg-white border border-slate-200 rounded-md focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none font-mono text-sm font-bold text-slate-900" dir="ltr">
             </div>
           </div>
           <div class="pt-4 flex gap-3">
             <button type="button" id="btn-cancel-add" class="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-semibold text-sm transition-colors" data-i18n="cancel">Cancel</button>
             <button type="submit" class="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md font-semibold text-sm shadow-sm transition-colors" data-i18n="save">Save Record</button>
           </div>
        </form>
      </div>
    </div>
  </div>
  
  <!-- Detail Modal -->
  <div id="modal-detail" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl border border-slate-200 shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
      <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-tight" data-i18n="detailTitle">Record Details</h2>
      </div>
      <!-- Injected detail content -->
      <div class="p-5 overflow-y-auto" id="detail-content"></div>
      <div class="p-4 border-t border-slate-100 bg-slate-50 flex gap-3">
         <button type="button" id="btn-delete" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-md font-semibold text-sm transition-colors flex-1 flex justify-center items-center gap-2">
           <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
           <span data-i18n="delete">Delete Record</span>
         </button>
         <button type="button" id="btn-close-detail" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-md font-semibold text-sm transition-colors flex-1" data-i18n="close">Close</button>
      </div>
    </div>
  </div>

  <!-- Standard ES Module Script Tag -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
